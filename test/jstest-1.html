<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JSのテスト</title>
</head>
<body>

    <h1>JavaScriptの動作テスト</h1>

    <script>
        // ここにJavaScriptの処理を書きます
        alert("ようこそ！");
    </script>
<p>(geminiのコードをそのまま写しただけ)</p>
    <h1 id="text">ボタンを押してみてください</h1>
    
    <button onclick="changeText()">クリック！</button>

    <script>
        function changeText() {
            // id="text" の要素を取得して文字を書き換えます
            document.getElementById("text").textContent = "ゲボ";
        }
    </script>
</body>
</html>
